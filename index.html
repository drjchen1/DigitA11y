
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitA11y</title>
  <meta name="description" content="Accessible transcription converting handwritten math notes into WCAG 2.2 AA compliant documents with smart figure handling and screen-reader math.">
  <meta property="og:title" content="DigitA11y">
  <meta property="og:description" content="Accessible transcription converting handwritten math notes into WCAG 2.2 AA compliant documents with smart figure handling and screen-reader math.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2309090b%22/><text y=%22.9em%22 x=%2250%25%22 font-family=%22sans-serif%22 font-weight=%22900%22 font-size=%2275%22 text-anchor=%22middle%22 fill=%22%236366f1%22>A</text></svg>">
  <!-- MathJax Config -->
  <script>
    window.MathJax = {
      loader: { load: ['[tex]/mathtools'] },
      tex: {
        packages: { '[+]': ['mathtools'] },
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
  
  <!-- PDF.js is lazily loaded when needed -->
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap');
    @import url('https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/open-dyslexic.min.css');
    body { font-family: 'Inter', sans-serif; }
    .math-content { 
      font-family: 'Inter', sans-serif; 
      font-size: 1.125rem;
      line-height: 1.7;
      color: #18181b; /* zinc-900 */
    }
    .math-content .flex > *,
    .math-content .grid > * {
      min-width: 0;
    }
    .math-content h1, .math-content h2, .math-content h3 {
      font-family: 'Inter', sans-serif;
      color: #09090b; /* zinc-950 */
    }
    .math-content .notebox { 
      border-left: 4px solid #6366f1; /* indigo-500 */
      padding: 1.5rem 2rem; 
      margin: 2.5rem 0; 
      background-color: #fafafa; /* zinc-50 */
      font-style: italic; 
      color: #3f3f46; /* zinc-700 */
      border-radius: 0 0.75rem 0.75rem 0;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    .math-content figure {
      margin: 2rem 0;
      padding: 0;
      background: #ffffff;
      border: 1px solid #e4e4e7; /* zinc-200 */
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .math-content figcaption {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      color: #3f3f46; /* zinc-700 */
      margin-top: 0;
      width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* Responsive fixes for AI generated content */
    .math-content img, 
    .math-content svg, 
    .math-content video {
      max-width: 100% !important;
      height: auto !important;
      display: block;
      margin: 0 auto;
    }

    /* Allow horizontal scrolling for wide math equations */
    .math-content mjx-container[display="true"] {
      max-width: 100% !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      margin: 2rem 0 !important;
      padding: 0.5rem 0 !important;
    }

    /* Mobile Responsive Typography & Padding */
    @media (max-width: 640px) {
      .math-content h1 { font-size: 1.75rem; margin-bottom: 1.5rem; }
      .math-content h2 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 1rem; }
      .math-content h3 { font-size: 1.25rem; margin-top: 1.5rem; }
      .math-content .notebox { 
        padding: 1rem 1.25rem; 
        margin: 1.5rem 0; 
      }
      .math-content mjx-container[display="true"] {
        margin: 1rem 0 !important;
      }
    }

    /* Fix alignment for math in flex containers */
    .math-content .flex mjx-container[display="true"] {
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Safety net: prevent double-boxing if math is nested in a notebox */
    .math-content .notebox mjx-container[display="true"] {
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 1rem 0 !important;
    }

    /* Allow horizontal scrolling for wide tables */
    .math-content table {
      max-width: 100%;
      overflow-x: auto;
      display: block;
    }

    @media print {
      .math-content mjx-container[display="true"],
      .math-content table,
      .math-content figure {
        overflow-x: visible !important;
        overflow-y: visible !important;
        white-space: normal !important;
      }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f4f4f5; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen selection:bg-indigo-200 selection:text-indigo-950">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
